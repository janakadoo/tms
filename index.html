<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS Pro | Advanced Transport Management System</title>
    <meta name="description" content="Professional Transport Management System — vehicles, drivers, trips, fuel, expenses, maintenance, routes and analytics all in one place.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">

    <!-- Icons (Lucide) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

    <!-- SheetJS (Excel Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- jsPDF & AutoTable (PDF Export) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Firebase (Cloud Sync & Auth) -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- sql.js (Local SQLite engine) -->
    <script src="lib/sql-wasm.js"></script>
</head>

<body class="dark-mode">

<!-- LOADING SCREEN -->
<div class="loading-screen" id="loadingScreen">
    <div class="loading-logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
        </svg>
    </div>
    <div class="loading-text" id="loadingText">Loading Workspace...</div>
    <div class="error-msg" id="startupError"></div>
</div>

<!-- AUTHENTICATION SCREEN -->
<div class="auth-screen hidden" id="authScreen">
    <div class="auth-box">
        <div class="auth-brand">
            <div class="auth-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
                </svg>
            </div>
            <h2>TMS Pro</h2>
            <p>Sign in to your transport workspace</p>
        </div>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="authEmail" class="form-input" required placeholder="admin@company.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="authPassword" class="form-input" required placeholder="••••••••">
            </div>
            <div class="auth-error" id="authErrorMsg"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:1rem;height:44px" id="loginBtn">Sign In</button>
            <div style="text-align:center;margin-top:1.5rem">
                <a href="#" id="forgotPasswordBtn" class="auth-link">Forgot password?</a>
            </div>
        </form>
    </div>
</div>

<!-- MAIN APP (HIDDEN UNTIL AUTHENTICATED) -->
<div class="app-shell hidden" id="appShell">

    <!-- SIDEBAR -->

            <div class="brand-text">

        <header class="topbar">

                </button>
                <div class="page-title-block">
                    <h1 id="pageTitle">Dashboard</h1>
                    <p class="page-subtitle" id="pageSubtitle"></p>
                </div>
            </div>

            <div class="topbar-right">
                <button class="topbar-btn" id="themeToggleBtn" title="Toggle theme">
                    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
